%YAML 1.3
---
# Logitech M720 - wheel tilt left: previous virtual desktop
- Key: [Left Tilt, pressed]
- KeyPress: [[Control_L, Super_L, Left], click]
...
---
# Logitech M720 - wheel tilt right: next virtual desktop
- Key: [Right Tilt, pressed]
- KeyPress: [[Control_L, Super_L, Right], click]
...
---
- Key: [MultiPlatform Gesture Button, pressed]
- KeyPress: [[Super_L, w], click]
...
---
# MX Mechanical Mini Easy-Switch 1: move the M720 to host 1.
- Feature: CHANGE HOST
- Device: '03108A04'
- TestBytes: [1, 2, 0, 0]
- Set: ['74C43D12', change-host, 0]
...
---
# MX Mechanical Mini Easy-Switch 2: move the M720 to host 2.
- Feature: CHANGE HOST
- Device: '03108A04'
- TestBytes: [1, 2, 1, 1]
- Set: ['74C43D12', change-host, 1]
...
---
# MX Mechanical Mini Easy-Switch 3: move the M720 to host 3.
- Feature: CHANGE HOST
- Device: '03108A04'
- TestBytes: [1, 2, 2, 2]
- Set: ['74C43D12', change-host, 2]
...
