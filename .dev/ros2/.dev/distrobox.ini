[osa-dev]
image=localhost/osa-dev:local

pull=false
root=false
replace=false
start_now=true
init=false

# Development tools
additional_packages="sudo passwd util-linux procps bash-completion less rsync"
additional_packages="openssh-client openssh-server"
additional_packages="gdb gdbserver ninja-build"
additional_packages="curl wget unzip ca-certificates neofetch"

# JetBrains Remote Development runtime dependencies
additional_packages="libwayland-client0 libwayland-cursor0 libxkbcommon0"
additional_packages="libxext6 libxrender1 libxtst6 libxi6 libfreetype6 libfontconfig1"

# JetBrains Gateway SSH endpoint.
# Distrobox uses the host network, therefore bind only to localhost.
init_hooks="install -d -m 0755 /run/sshd"
init_hooks="ssh-keygen -A"

init_hooks="/usr/sbin/sshd -t -o Port=2222 -o ListenAddress=127.0.0.1 -o PubkeyAuthentication=yes -o PasswordAuthentication=no -o PermitRootLogin=no -o AuthorizedKeysFile=%h/.ssh/authorized_keys_osa_dev -o PidFile=/run/sshd-osa-dev.pid"

init_hooks="/usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 -o PubkeyAuthentication=yes -o PasswordAuthentication=no -o PermitRootLogin=no -o AuthorizedKeysFile=%h/.ssh/authorized_keys_osa_dev -o PidFile=/run/sshd-osa-dev.pid"
